[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-craft"
version = "1.0.0"
description = "A complete active-learning workflow for YOLO object detection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "YOLO CRAFT" }]
keywords = ["yolo", "object-detection", "active-learning", "ultralytics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "ultralytics>=8.3.0",
    "opencv-python>=4.9.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0.1",
]

[project.urls]
Homepage = "https://github.com/NovaAixYoussef/yolo-craft"
Repository = "https://github.com/NovaAixYoussef/yolo-craft"
Issues = "https://github.com/NovaAixYoussef/yolo-craft/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
yolo-craft = "yolo_craft.cli:main"

[tool.setuptools.packages.find]
include = ["yolo_craft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
